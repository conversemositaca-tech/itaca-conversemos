name: Tests

# Corre las pruebas en cada Pull Request y en cada push a main. El resultado
# (✅ o ❌) aparece en el PR, que es donde Mirai aprueba desde el celular: si la
# liquidación o la agenda se rompen, se ve ANTES del merge y no en producción.
#
# Cuatro jobs en paralelo (ninguno depende del otro):
#   test       — backend completo en SQLite (check REQUERIDO por el ruleset de main: no renombrar)
#   seguridad  — regresión de seguridad, matriz rol × endpoint y campos por rol
#   postgres   — suite completa en PostgreSQL 17, incluidas las carreras de concurrencia
#   frontend   — build + ESLint sin deuda nueva (scripts/eslint-baseline.json)
#
# No usa la API de Anthropic, así que no consume créditos.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Base de prueba local del runner: no toca Railway ni ninguna base real.
  DATABASE_URL: sqlite:///db.sqlite3
  DJANGO_DB_SSL: "False"

jobs:
  test:
    # El nombre del check DEBE ser exactamente "test": es el check requerido
    # por el ruleset "Protección de main". Un `name:` distinto lo deja colgado.
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # la misma del Dockerfile
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Configuración válida
        run: python manage.py check

      - name: Migraciones al día
        # Falla si alguien cambió un modelo y olvidó generar la migración: en
        # producción el contenedor migra al arrancar, así que eso rompería el deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Correr las pruebas
        # La suite usa un hasher barato solo bajo `manage.py test` (config/settings.py).
        run: python manage.py test --noinput --timing

  seguridad:
    name: seguridad (P0-S y matriz de permisos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Regresión de seguridad, matriz de permisos y hasher de pruebas
        # Adjuntos clínicos, tokens de consentimiento, token de integración,
        # riesgo clínico sugerido por IA, hosts de Railway y 168 celdas
        # rol × endpoint. Si una celda pasa de 4xx a 2xx: escalamiento.
        run: >
          python manage.py test --noinput
          core.tests_seguridad_p0 core.tests_matriz_permisos core.tests_hasher
          core.tests_campos_por_rol core.tests_fuentes_unicas core.tests_auditoria_ia_respaldo
          finanzas.tests_cobros_seguridad

  postgres:
    name: postgres (suite completa en el motor de producción)
    # SQLite no reproduce concurrencia, locks (select_for_update, SKIP LOCKED)
    # ni constraints exactos de Postgres. Producción es Postgres: aquí corre la
    # suite entera, incluidas las carreras (doble cobro, paquete, correo) que
    # en SQLite se saltan.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: itaca
          POSTGRES_PASSWORD: itaca
          POSTGRES_DB: itaca
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U itaca"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://itaca:itaca@localhost:5432/itaca
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas en PostgreSQL
        run: python manage.py test --noinput --timing

  frontend:
    name: frontend (build y ESLint sin deuda nueva)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"          # la misma del Dockerfile
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests de frontend (runner nativo de Node, sin dependencias)
        # Sin argumentos: descubre los *.test.js de forma recursiva (excluye
        # node_modules). Un glob como "src/**/*.test.js" solo funciona desde
        # Node 21; el CI y el Dockerfile usan Node 20.
        run: node --test

      - name: Compilar la app
        # Un error de JSX no lo ve ningún test de Python, pero el Dockerfile
        # compila el front al desplegar: si no compila, no hay despliegue.
        run: npm run build

      - name: ESLint sin deuda nueva
        # La deuda heredada (74 errores / 38 avisos) está en la línea base por
        # archivo; falla solo si algún archivo tiene MÁS errores que antes.
        run: |
          npx eslint . -f json -o eslint.json || true
          node ../scripts/eslint-sin-deuda.mjs eslint.json
